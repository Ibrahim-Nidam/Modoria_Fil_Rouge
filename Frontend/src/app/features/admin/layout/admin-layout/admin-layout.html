<div class="flex h-screen overflow-hidden bg-background text-foreground">
  <!-- Desktop sidebar -->
  <div class="hidden lg:flex shrink-0">
    <app-admin-sidebar [collapsed]="sidebarCollapsed()" />
  </div>

  <!-- Mobile sidebar overlay -->
  @if (mobileOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden">
      <!-- Backdrop -->
      <div
        class="absolute inset-0 bg-black/50 transition-opacity"
        (click)="closeMobile()">
      </div>
      <!-- Sidebar panel -->
      <div class="relative z-50 h-full w-64">
        <app-admin-sidebar [collapsed]="false" (closeMobile)="closeMobile()" />
      </div>
    </div>
  }

  <!-- Main content area -->
  <div class="flex flex-col flex-1 min-w-0 overflow-hidden">
    <app-admin-header (toggleSidebar)="toggleSidebar()" />
    <main class="flex-1 overflow-y-auto p-4 lg:p-6 bg-muted/30">
      <router-outlet />
    </main>
  </div>
</div>
