<div class="bg-background border border-muted rounded-none p-5 flex items-start gap-4 shadow-sm hover:shadow-md transition-shadow">
  <div class="flex items-center justify-center w-12 h-12 rounded-none bg-primary/10 text-primary shrink-0">
    <span class="material-symbols-outlined text-2xl">{{ icon() }}</span>
  </div>
  <div class="flex flex-col min-w-0">
    <span class="text-sm text-foreground/60 font-medium truncate">{{ title() }}</span>
    <span class="text-2xl font-semibold text-foreground mt-0.5">{{ value() }}</span>
    @if (trend()) {
      <span class="text-xs mt-1 font-medium"
        [class]="trendUp() === true ? 'text-green-500' : trendUp() === false ? 'text-red-500' : 'text-foreground/50'">
        @if (trendUp() === true) {
          <span class="material-symbols-outlined text-xs align-middle">trending_up</span>
        } @else if (trendUp() === false) {
          <span class="material-symbols-outlined text-xs align-middle">trending_down</span>
        }
        {{ trend() }}
      </span>
    }
  </div>
</div>
