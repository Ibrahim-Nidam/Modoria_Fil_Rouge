<div class="auth-viewport" [ngClass]="'theme-' + activeSeason">
    <!-- Custom Auth Header with Theme Controls -->
    <app-auth-header></app-auth-header>

    <div class="botanical-overlay"></div>

    <main class="auth-main">
        <app-form title="MODORIA" subtitle="Maison de Mode Masculine"
            footerText="Your account security is our seasonal priority" maxWidth="500px">

            <div form-header class="logo-container">
                <h1 class="logo-title font-display">MODORIA</h1>
                <p class="logo-subtitle">Maison de Mode Masculine</p>

                <div class="ornamental-rule">
                    <div class="diamond"></div>
                </div>

                <h2 class="welcome-text">New Credentials</h2>
                <p class="instruction-text">Please establish a new secure password for your Modoria account access.</p>
            </div>

            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
                <app-input label="New Password" type="password" placeholder="Enter new password"
                    formControlName="newPassword"
                    [error]="getFieldError('newPassword')"
                    customClass="replica-input">
                </app-input>

                <app-input label="Confirm Password" type="password" placeholder="Confirm new password"
                    formControlName="confirmPassword"
                    [error]="getFieldError('confirmPassword')"
                    customClass="replica-input">
                </app-input>

                <div class="flex flex-col gap-4 mt-4">
                    <app-button type="submit" variant="primary" size="lg" [disabled]="isLoading" customClass="w-full">
                        {{ isLoading ? 'RESETTING...' : 'UPDATE PASSWORD' }}
                    </app-button>

                    <app-button type="button" variant="ghost" size="none" routerLink="/auth/login"
                        customClass="w-full !text-xs !tracking-[0.2em] !uppercase !opacity-60 hover:!opacity-100">
                        CANCEL RESET
                    </app-button>
                </div>
            </form>
        </app-form>
    </main>
</div>
