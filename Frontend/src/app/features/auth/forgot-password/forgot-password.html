<div class="auth-viewport" [ngClass]="'theme-' + activeSeason">
    <!-- Custom Auth Header with Theme Controls -->
    <app-auth-header></app-auth-header>

    <div class="botanical-overlay"></div>

    <main class="auth-main">
        <app-form title="MODORIA" subtitle="Maison de Mode Masculine"
            footerText="Check your inbox for a seasonal reset invitation" maxWidth="500px">

            <div form-header class="logo-container">
                <h1 class="logo-title font-display">MODORIA</h1>
                <p class="logo-subtitle">Maison de Mode Masculine</p>

                <div class="ornamental-rule">
                    <div class="diamond"></div>
                </div>

                <h2 class="welcome-text">Reset Access</h2>
                <p class="instruction-text">Enter your e-mail address and we will send you a secure link to reset your account password.</p>
            </div>

            <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">
                <app-input label="E-Mail Address" type="email" placeholder="E.g. member@modoria.com"
                    formControlName="email"
                    [error]="getFieldError('email')"
                    customClass="replica-input">
                </app-input>

                <div class="flex flex-col gap-4">
                    <app-button type="submit" variant="primary" size="lg" [disabled]="isLoading" customClass="w-full">
                        {{ isLoading ? 'SENDING...' : 'SEND RESET LINK' }}
                    </app-button>

                    <app-button type="button" variant="ghost" size="none" routerLink="/auth/login"
                        customClass="w-full !text-xs !tracking-[0.2em] !uppercase !opacity-60 hover:!opacity-100">
                        RETURN TO SIGN IN
                    </app-button>
                </div>
            </form>
        </app-form>
    </main>
</div>
