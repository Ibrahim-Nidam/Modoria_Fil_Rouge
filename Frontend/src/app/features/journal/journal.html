<app-header></app-header>

<main class="min-h-screen bg-background pt-24 text-foreground">
  <section class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-10">
    <p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">Editorial</p>
    <h1 class="mt-3 text-3xl font-bold md:text-4xl">Modoria Journal</h1>
    <p class="mt-3 max-w-2xl text-sm text-foreground/70">Stories, guides, and designer perspectives connected to the current season.</p>

    <div class="mt-8 grid gap-4 md:grid-cols-3">
      @for (entry of entries; track entry.title) {
        <article class="rounded-2xl border border-muted bg-background p-5">
          <p class="text-xs font-semibold uppercase tracking-[0.14em] text-primary">{{ entry.tag }}</p>
          <h2 class="mt-2 text-lg font-semibold">{{ entry.title }}</h2>
          <p class="mt-2 text-sm leading-relaxed text-foreground/70">{{ entry.summary }}</p>
          <a routerLink="/catalog" class="mt-4 inline-flex text-xs font-semibold uppercase tracking-[0.14em] text-primary hover:underline">
            Explore Related Pieces
          </a>
        </article>
      }
    </div>
  </section>
</main>
