<header class="auth-header">
    <div class="header-left">
        <img [src]="logoSource" alt="Modoria"
                    class="h-11 w-auto object-contain transition-transform group-hover:scale-105" />
    </div>

    <nav class="header-center">
        <a class="nav-link" href="#">SHOP</a>
        <a class="nav-link" href="#">COLLECTIONS</a>
        <a class="nav-link" href="#">MAISON</a>
        <a class="nav-link" href="#">JOURNAL</a>
    </nav>

    <div class="header-right">
        <!-- Theme Controls for Testing -->
        <div class="theme-controls">
            <select (change)="onSeasonChange($event)" class="season-select" title="Switch Season">
                @for (s of availableSeasons; track s) {
                <option [value]="s" [selected]="s === themeService.activeSeason()">{{ s | uppercase }}</option>
                }
            </select>

            <button (click)="toggleDarkMode()" class="theme-toggle"
                [title]="isDark ? 'Switch to Light' : 'Switch to Dark'">
                <span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
            </button>
        </div>

        <div class="action-icons">
            <span class="material-symbols-outlined icon">search</span>
            <span class="material-symbols-outlined icon">shopping_bag</span>
        </div>
    </div>
</header>
