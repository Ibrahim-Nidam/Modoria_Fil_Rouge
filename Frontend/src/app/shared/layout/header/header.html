<header
    class="sticky top-0 z-50 w-full border-b border-primary/20 dark:border-white/10 bg-white/95 dark:bg-black/95 backdrop-blur-sm transition-colors duration-300">
    <div class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-6 lg:px-12">
        <!-- Left: Logo -->
        <div class="flex items-center gap-4">
            <a class="flex items-center gap-3 text-black dark:text-white group" href="#">
                <div
                    class="flex size-8 items-center justify-center rounded-sm bg-black dark:bg-white text-white dark:text-black transition-transform group-hover:scale-105">
                    <span class="font-serif text-xl font-bold">M</span>
                </div>
                <span class="font-serif text-xl font-bold tracking-widest uppercase">Modoria</span>
            </a>
        </div>

        <!-- Center: Navigation -->
        <nav class="hidden items-center gap-8 md:flex">
            <a class="text-sm font-medium uppercase tracking-widest text-black/70 dark:text-white/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">New Arrivals</a>
            <a class="text-sm font-medium uppercase tracking-widest text-black/70 dark:text-white/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Designers</a>
            <a class="text-sm font-medium uppercase tracking-widest text-black/70 dark:text-white/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Clothing</a>
            <a class="text-sm font-medium uppercase tracking-widest text-black/70 dark:text-white/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Shoes</a>
            <a class="text-sm font-medium uppercase tracking-widest text-black/70 dark:text-white/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Journal</a>
        </nav>

        <!-- Right: Actions -->
        <div class="flex items-center gap-6">
            <div class="relative hidden lg:block group w-48 hover:w-64 transition-all duration-300">
                <app-input type="text" placeholder="Search..."
                    customClass="!h-9 !rounded-none !border !border-black/20 dark:!border-white/20 !px-4 !py-2 !text-sm focus:!border-primary focus:!ring-1 focus:!ring-primary">
                </app-input>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor"
                    class="w-4 h-4 absolute right-3 top-2.5 text-black/50 dark:text-white/50 pointer-events-none">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>

            <app-button variant="ghost" size="none"
                customClass="flex flex-row items-center gap-2 text-black dark:text-white hover:text-primary dark:hover:text-primary transition-colors border-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
            </app-button>

            <app-button variant="ghost" size="none"
                customClass="relative flex flex-row items-center gap-2 text-black dark:text-white hover:text-primary dark:hover:text-primary transition-colors border-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
                <span
                    class="absolute -right-1.5 -top-1.5 flex size-4 items-center justify-center rounded-none bg-primary text-[10px] font-bold text-white">2</span>
            </app-button>
        </div>
    </div>

    <!-- Dynamic Collection Banner -->
    @if (collectionName) {
    <div
        class="flex w-full justify-center border-t border-primary/10 bg-black/5 dark:bg-white/5 py-1.5 transition-colors">
        <div
            class="flex items-center gap-2 bg-primary/10 px-3 py-0.5 text-xs font-bold uppercase tracking-widest text-primary">
            @if (collectionIcon) {
            <span class="material-symbols-outlined text-sm">{{ collectionIcon }}</span>
            }
            {{ collectionName }} Collection
        </div>
    </div>
    }
</header>
