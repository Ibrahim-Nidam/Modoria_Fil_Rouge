<header
    class="sticky top-0 z-50 w-full border-b border-primary/20 bg-background/95 backdrop-blur-sm transition-colors duration-300">
    <div class="mx-auto flex h-20 max-w-[1440px] items-center justify-between px-6 lg:px-12">
        <!-- Left: Logo -->
        <div class="flex items-center gap-4">
            <a class="flex items-center gap-3 text-foreground group" href="#">
                <img [src]="logoSource" alt="Modoria"
                    class="h-11 w-auto object-contain transition-transform group-hover:scale-105" />
                <span class="font-serif text-2xl font-black tracking-[0.2em] uppercase ml-2">Modoria</span>
            </a>
        </div>

        <!-- Center: Navigation -->
        <nav class="hidden items-center gap-8 md:flex">
            <a class="text-sm font-medium uppercase tracking-widest text-foreground/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">New Arrivals</a>
            <a class="text-sm font-medium uppercase tracking-widest text-foreground/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Designers</a>
            <a class="text-sm font-medium uppercase tracking-widest text-foreground/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Clothing</a>
            <a class="text-sm font-medium uppercase tracking-widest text-foreground/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Shoes</a>
            <a class="text-sm font-medium uppercase tracking-widest text-foreground/70 hover:text-primary dark:hover:text-primary transition-colors"
                href="#">Journal</a>
        </nav>

        <!-- Right: Actions -->
        <div class="flex items-center gap-6">
            <select (change)="onSeasonChange($event)"
                class="bg-transparent border border-foreground/20 text-xs text-foreground uppercase tracking-widest py-1 px-2 focus:border-primary focus:ring-1 focus:ring-primary rounded-none cursor-pointer outline-none hidden md:block">
                @for (s of availableSeasons; track s) {
                <option [value]="s" [selected]="s === themeService.activeSeason()">{{ s }}</option>
                }
            </select>
            <button (click)="toggleDarkMode()"
                class="text-foreground/50 hover:text-primary transition-colors hidden md:block"
                title="Toggle Dark Mode">
                @if (!themeService.isDarkMode()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                </svg>
                }
            </button>

            <div class="relative hidden lg:block group w-48 hover:w-64 transition-all duration-300">
                <app-input type="text" placeholder="Search..."
                    customClass="!h-9 !rounded-none !border !border-foreground/20 dark:!border-background/20 !px-4 !py-2 !text-sm focus:!border-primary focus:!ring-1 focus:!ring-primary">
                </app-input>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor"
                    class="w-4 h-4 absolute right-3 top-2.5 text-foreground/50 pointer-events-none">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>

            <app-button variant="ghost" size="none"
                customClass="flex flex-row items-center gap-2 text-foreground hover:text-primary dark:hover:text-primary transition-colors border-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                </svg>
            </app-button>

            <app-button variant="ghost" size="none"
                customClass="relative flex flex-row items-center gap-2 text-foreground hover:text-primary dark:hover:text-primary transition-colors border-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
                <span
                    class="absolute -right-1.5 -top-1.5 flex size-4 items-center justify-center rounded-none bg-primary text-[10px] font-bold text-background">2</span>
            </app-button>
        </div>
    </div>

    <!-- Dynamic Collection Banner -->
    @if (collectionName) {
    <div class="flex w-full justify-center border-t border-primary/10 bg-foreground/5 py-1.5 transition-colors">
        <div
            class="flex items-center gap-2 bg-primary/10 px-3 py-0.5 text-xs font-bold uppercase tracking-widest text-primary">
            @if (collectionIcon) {
            <span class="material-symbols-outlined text-sm">{{ collectionIcon }}</span>
            }
            {{ collectionName }} Collection
        </div>
    </div>
    }
</header>
