<label class="relative flex items-center cursor-pointer font-sans" [class.opacity-50]="disabled">
    <input type="checkbox" class="peer sr-only" [checked]="checked" [disabled]="disabled" (change)="onChange($event)" />
    <div
        class="h-4 w-4 border border-black dark:border-white rounded-none peer-focus:ring-2 peer-focus:ring-black/20 dark:peer-focus:ring-white/20 transition-colors bg-transparent flex items-center justify-center">
        <svg class="w-3 h-3 text-black dark:text-white opacity-0 peer-checked:opacity-100 transition-opacity"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
    </div>
    @if (label) {
    <span class="ml-3 text-sm text-black dark:text-white select-none">{{ label }}</span>
    }
</label>
