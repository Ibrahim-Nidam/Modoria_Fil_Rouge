<div class="w-full overflow-x-auto font-sans">
    <table class="w-full text-sm text-left border-collapse">
        <thead
            class="text-xs uppercase tracking-widest text-black/60 dark:text-white/60 border-b border-black/10 dark:border-white/10">
            <tr>
                @for (col of columns; track col.key) {
                <th scope="col" class="px-6 py-4 font-semibold whitespace-nowrap">{{ col.label }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for (row of data; track row.id || $index) {
            <tr class="border-b border-black/5 dark:border-white/5 bg-transparent transition-colors hover:bg-black/5 dark:hover:bg-white/5"
                [class.cursor-pointer]="hoverable" (click)="onRowClick(row)">
                @for (col of columns; track col.key) {
                <td class="px-6 py-5 text-black/80 dark:text-white/80 whitespace-nowrap">
                    <!-- If a specific template needs to be rendered, we render it. Otherwise, simple text -->
                    {{ row[col.key] }}
                </td>
                }
            </tr>
            } @empty {
            <tr>
                <td [attr.colspan]="columns.length"
                    class="px-6 py-12 text-center text-black/40 dark:text-white/40 italic">
                    {{ emptyMessage }}
                </td>
            </tr>
            }
        </tbody>
    </table>
</div>
