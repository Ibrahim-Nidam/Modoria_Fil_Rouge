<div class="w-full overflow-x-auto font-sans">
 <table class="w-full text-sm text-left border-collapse">
 <thead
 class="text-xs uppercase tracking-widest text-foreground/60 border-b border-foreground/10">
 <tr>
 @for (col of columns; track col.key) {
 <th scope="col"class="px-6 py-4 font-semibold whitespace-nowrap">{{ col.label }}</th>
 }
 </tr>
 </thead>
 <tbody>
 @for (row of data; track row.id || $index) {
 <tr class="border-b border-foreground/5 bg-transparent transition-colors hover:bg-foreground/5"
 [class.cursor-pointer]="hoverable"(click)="onRowClick(row)">
 @for (col of columns; track col.key) {
 <td class="px-6 py-5 text-foreground/80 whitespace-nowrap">
 <!-- If a specific template needs to be rendered, we render it. Otherwise, simple text -->
 {{ row[col.key] }}
 </td>
 }
 </tr>
 } @empty {
 <tr>
 <td [attr.colspan]="columns.length"
 class="px-6 py-12 text-center text-foreground/40 italic">
 {{ emptyMessage }}
 </td>
 </tr>
 }
 </tbody>
 </table>
</div>
