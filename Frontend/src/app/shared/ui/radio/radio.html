<label class="relative flex items-center cursor-pointer font-sans group" [class.opacity-50]="disabled">
    <input type="radio" [name]="name" [value]="value" class="peer sr-only" [checked]="checked" [disabled]="disabled"
        (change)="onChange($event)" />
    <div
        class="h-4 w-4 border border-black dark:border-white rounded-full peer-focus:ring-2 peer-focus:ring-black/20 dark:peer-focus:ring-white/20 transition-colors bg-transparent flex items-center justify-center">
        <div
            class="w-2 h-2 rounded-full bg-black dark:bg-white scale-0 peer-checked:scale-100 transition-transform duration-200 ease-out">
        </div>
    </div>
    @if (label) {
    <span class="ml-3 text-sm text-black dark:text-white select-none transition-colors">{{ label }}</span>
    }
</label>
