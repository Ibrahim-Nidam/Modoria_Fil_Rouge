<div class="relative w-full flex flex-col gap-1.5 font-sans">
 @if (label) {
 <label [for]="id"class="text-xs font-semibold tracking-widest uppercase text-foreground/70">
 {{ label }}
 </label>
 }

 <div class="relative flex items-center">
 <input [id]="id"[type]="type"[placeholder]="placeholder"[disabled]="disabled"[value]="value"
 (input)="onInput($event)"
 class="w-full bg-transparent border-0 border-b border-foreground/20 pb-2 text-sm text-foreground placeholder:text-foreground/30 dark:placeholder:text-background/30 focus:outline-none focus:ring-0 focus:border-foreground transition-colors duration-300 rounded-none disabled:opacity-50 disabled:cursor-not-allowed"
 [class]="customClass + (error ? ' !border-red-500' : '')"/>
 </div>

 @if (error) {
 <span class="text-xs text-red-500 mt-1">{{ error }}</span>
 }
</div>
