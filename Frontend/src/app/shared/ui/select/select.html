<div class="relative w-full flex flex-col gap-1.5 font-sans">
    @if (label) {
    <label [for]="id" class="text-xs font-semibold tracking-widest uppercase text-black/70 dark:text-white/70">
        {{ label }}
    </label>
    }

    <div class="relative flex items-center">
        <select [id]="id" [disabled]="disabled" [value]="value" (change)="onChange($event)"
            class="w-full bg-transparent border-0 border-b border-black/20 dark:border-white/20 pb-2 text-sm text-black dark:text-white appearance-none cursor-pointer focus:outline-none focus:ring-0 focus:border-black dark:focus:border-white transition-colors duration-300 rounded-none disabled:opacity-50 disabled:cursor-not-allowed"
            [class]="error ? '!border-red-500' : ''">
            @if (placeholder) {
            <option value="" disabled selected hidden>{{ placeholder }}</option>
            }
            @for (option of options; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
            }
        </select>

        <!-- Custom dropdown icon -->
        <div class="absolute right-0 pointer-events-none mr-2">
            <svg class="w-4 h-4 text-black dark:text-white transition-transform duration-300" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="square" stroke-linejoin="miter" stroke-width="1.5" d="M19 9l-7 7-7-7" />
            </svg>
        </div>
    </div>

    @if (error) {
    <span class="text-xs text-red-500 mt-1">{{ error }}</span>
    }
</div>
